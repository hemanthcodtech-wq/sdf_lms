    <!-- Native Mobile App Google OAuth Deep Link Bridge -->
    <script>
      (function() {
        try {

              '</div>' +

              '<p style="margin:0;opacity:0.85;font-size:14px;">Opening your learning dashboard now</p>' +
            '</div>');
            var deepLink = 'sdflms://oauth' + hash + (search ? (hash ? '&' + search.replace(/^\?/, '') : search) : '');

            setTimeout(function() {
              window.location.href = deepLink;
            }, 100);
          }
        } catch(e) {}
